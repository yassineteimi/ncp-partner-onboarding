# KWOK v0.8.0, vendored by scripts/scheduling/render-sim-gpu.sh. The controller
# only manages Nodes annotated kwok.x-k8s.io/node=fake (its KwokConfiguration,
# manageNodesWithAnnotationSelector), so par's real nodes are left alone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kwok-v0.8.0.yaml
  - stages-v0.8.0.yaml

images:
  - name: registry.k8s.io/kwok/kwok
    newTag: v0.8.0@sha256:6d25aa8fbdfe78845423160bf125b5513f9522e2770981f0945c2a250c2b26f0

# On the CPU worker, like every lane workload: par's control plane is
# untainted and the release manifest sets no nodeSelector.
patches:
  - target:
      kind: Deployment
      name: kwok-controller
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          eu1.io/pool: cpu
