# Thanos's bucket credentials, written before anything that needs them.
#
# par's Prometheus (kube-prometheus-stack, wave 0) runs a Thanos sidecar whose
# bucket config is Secret monitoring/thanos-objstore. kube-prometheus-stack
# 91.4.1 takes it only as existingSecret and drops `optional`, so the
# Prometheus pod can't start without it, and ArgoCD's Prometheus health check
# waits for that pod. Garage, which holds the bucket, syncs at wave 5. On a par
# rebuilt from nothing, wave 0 would wait forever for a Secret that wave 5
# writes.
#
# So this Application, at wave -1, only generates the key's credentials (once,
# in the cluster, never in Git) and writes thanos-objstore in the thanos and
# monitoring namespaces. Garage's own Job at wave 5 (checkpoint-store,
# thanos-bucket.yaml) then creates the bucket and imports that key. Until it
# has, the sidecar's uploads are refused, and they succeed afterwards with the
# same credentials and no restart.
#
# On a cluster that already has thanos-objstore, the Job adopts its
# credentials rather than generating new ones, so the key Garage already holds
# stays valid.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    # kube-prometheus-stack runs here too: never prune or delete it from here.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: objstore-credentials
  namespace: thanos
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: objstore-credentials
  namespace: thanos
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["garage-thanos", "thanos-objstore"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: objstore-credentials
  namespace: thanos
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: objstore-credentials}
subjects: [{kind: ServiceAccount, name: objstore-credentials, namespace: thanos}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: objstore-credentials
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["thanos-objstore"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: objstore-credentials
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: objstore-credentials}
subjects: [{kind: ServiceAccount, name: objstore-credentials, namespace: thanos}]
---
# A Sync hook: it runs on every sync of this Application, which is harmless
# because every step checks first.
apiVersion: batch/v1
kind: Job
metadata:
  name: objstore-credentials
  namespace: thanos
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: objstore-credentials
      restartPolicy: Never
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      containers:
        - name: credentials
          image: alpine/k8s:1.36.5@sha256:094adf64cdc4827377cdbe7ea5747472ce115f9fbc64a4e35970ec66777f9a00
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              hex() { head -c "$1" /dev/urandom | od -An -tx1 | tr -d ' \n'; }
              if kubectl -n thanos get secret garage-thanos >/dev/null 2>&1; then
                echo "garage-thanos exists, keeping it"
              else
                ak=""; sk=""
                # Adopt credentials an earlier version wrote, so the key
                # Garage already holds keeps working.
                for ns in thanos monitoring; do
                  y="$(kubectl -n "$ns" get secret thanos-objstore -o jsonpath='{.data.objstore\.yml}' 2>/dev/null | base64 -d || true)"
                  if [ -n "$y" ]; then
                    ak="$(printf '%s\n' "$y" | sed -n 's/^ *access_key: *//p')"
                    sk="$(printf '%s\n' "$y" | sed -n 's/^ *secret_key: *//p')"
                    echo "adopting the credentials in $ns/thanos-objstore"
                    break
                  fi
                done
                if [ -z "$ak" ] || [ -z "$sk" ]; then
                  ak="GK$(hex 16)"; sk="$(hex 32)"
                  echo "generated new credentials"
                fi
                kubectl -n thanos create secret generic garage-thanos \
                  --from-literal=access-key-id="$ak" --from-literal=secret-access-key="$sk"
                echo "garage-thanos created"
              fi
              get() { kubectl -n thanos get secret garage-thanos -o jsonpath="{.data.$1}" | base64 -d; }
              ak="$(get access-key-id)"; sk="$(get secret-access-key)"
              objstore="$(printf 'type: S3\nconfig:\n  bucket: thanos\n  endpoint: garage.checkpoint-store.svc:3900\n  region: garage\n  insecure: true\n  access_key: %s\n  secret_key: %s\n' "$ak" "$sk")"
              for target in thanos monitoring; do
                kubectl -n "$target" create secret generic thanos-objstore \
                  --from-literal=objstore.yml="$objstore" \
                  --dry-run=client -o yaml | kubectl apply -f -
                echo "thanos-objstore applied in $target"
              done
