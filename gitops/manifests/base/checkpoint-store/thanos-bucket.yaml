# A second bucket in the same Garage, for Thanos (use case 6), with its own key
# that can read and write that bucket and nothing else.
#
# Garage's single-node mode only makes the default key and bucket at start, so
# this Job adds the rest through Garage's own CLI, run inside the Garage pod:
# `garage bucket create`, `garage key import` and `garage bucket allow`, whose
# options were read in src/garage/cli/structs.rs at v2.4.1.
#
# It doesn't make the credentials. They come from Secret thanos/garage-thanos,
# which the objstore-credentials Application writes at wave -1, before
# kube-prometheus-stack needs them (gitops/manifests/base/objstore-credentials).
# This Job, at Garage's wave 5, imports that key. Each step checks first, so it
# runs safely on every sync.
#
# The thanos namespace belongs to this file. Thanos's own Applications create
# their resources in it without managing the Namespace object.
apiVersion: v1
kind: Namespace
metadata:
  name: thanos
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-thanos
  namespace: checkpoint-store
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-thanos
  namespace: checkpoint-store
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: garage-thanos}
subjects: [{kind: ServiceAccount, name: garage-bootstrap, namespace: checkpoint-store}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-thanos-reader
  namespace: thanos
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["garage-thanos"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-thanos-reader
  namespace: thanos
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: garage-thanos-reader}
subjects: [{kind: ServiceAccount, name: garage-bootstrap, namespace: checkpoint-store}]
---
# A Sync hook rather than a plain Job: it runs again on every sync, which is
# harmless because every step checks first, and a change to it never meets the
# immutable pod template of an existing Job. Wave 1 puts it after Garage's
# StatefulSet (wave 0) in this Application.
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-thanos
  namespace: checkpoint-store
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: garage-bootstrap
      restartPolicy: Never
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      containers:
        - name: thanos-bucket
          image: alpine/k8s:1.36.5@sha256:094adf64cdc4827377cdbe7ea5747472ce115f9fbc64a4e35970ec66777f9a00
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Written by the objstore-credentials Job at wave -1; wait a
              # little in case this sync raced it.
              for _ in $(seq 1 30); do
                kubectl -n thanos get secret garage-thanos >/dev/null 2>&1 && break
                sleep 10
              done
              get() { kubectl -n thanos get secret garage-thanos -o jsonpath="{.data.$1}" | base64 -d; }
              ak="$(get access-key-id)"; sk="$(get secret-access-key)"
              [ -n "$ak" ] && [ -n "$sk" ] || { echo "no thanos/garage-thanos credentials"; exit 1; }

              ns=checkpoint-store
              kubectl -n "$ns" wait --for=condition=Ready pod/garage-0 --timeout=300s
              g() { kubectl -n "$ns" exec garage-0 -c garage -- /garage "$@"; }
              if g bucket info thanos >/dev/null 2>&1; then echo "bucket thanos exists"; else g bucket create thanos; fi
              if g key info "$ak" >/dev/null 2>&1; then echo "key exists"; else g key import --yes -n thanos "$ak" "$sk"; fi
              g bucket allow --read --write thanos --key "$ak"
