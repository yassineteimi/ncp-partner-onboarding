# Thanos store gateway: serves the blocks in Garage to Query. This is what
# still answers for fin once Receive has pruned the tenant, weeks after the
# site was deleted.
#
# Its data directory is a cache of block indexes, rebuilt from the bucket on
# start, so an emptyDir is enough and nothing pins it to a disk.
apiVersion: v1
kind: Service
metadata:
  name: thanos-store
  namespace: thanos
  labels: {app.kubernetes.io/name: thanos-store, app.kubernetes.io/part-of: thanos}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: thanos-store}
  ports:
    - {name: grpc, port: 10901, targetPort: grpc}
    - {name: http, port: 10902, targetPort: http}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-store
  namespace: thanos
  labels: {app.kubernetes.io/name: thanos-store, app.kubernetes.io/part-of: thanos}
spec:
  serviceName: thanos-store
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: thanos-store}
  template:
    metadata:
      labels: {app.kubernetes.io/name: thanos-store, app.kubernetes.io/part-of: thanos}
    spec:
      nodeSelector:
        eu1.io/pool: cpu
      containers:
        - name: thanos
          image: quay.io/thanos/thanos:v0.42.4@sha256:b567818fe608067eb0f1d7c2c4fe361e7ad83c8a256234c97685f1d0bf670cc8
          args:
            - store
            - --log.level=info
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            - --data-dir=/var/thanos/store
            - --objstore.config-file=/etc/thanos/objstore/objstore.yml
          ports:
            - {name: grpc, containerPort: 10901}
            - {name: http, containerPort: 10902}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/thanos/store}
            - {name: objstore, mountPath: /etc/thanos/objstore, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 2Gi}
        - name: objstore
          secret: {secretName: thanos-objstore}
