# Thanos Receive: where fin's Prometheus writes, so fin's metrics are on par
# within seconds and outlive the site (ADR 0009).
#
# One replica and no hashring, which makes it an ingestor that keeps everything
# it receives (determineMode in cmd/thanos/receive.go at v0.42.4). One tenant
# per site, taken from the client certificate's common name, so each site gets
# its own TSDB here and its own blocks in the bucket, labelled tenant_id.
#
# On SIGTERM Receive flushes its head into a block and uploads it before it
# exits (receive.go L725-736 and L818-832), so powering the CPU worker off with
# make par-cpu-down is also what pushes the last window into Garage.
#
# Remote write is reachable from outside on NodePort 30291 of the CPU worker,
# and the Scaleway security group opens it to fin's addresses only, during a
# window. Inside the cluster Query reads it over gRPC without TLS.
apiVersion: v1
kind: Service
metadata:
  name: thanos-receive
  namespace: thanos
  labels: {app.kubernetes.io/name: thanos-receive, app.kubernetes.io/part-of: thanos}
spec:
  selector: {app.kubernetes.io/name: thanos-receive}
  ports:
    - {name: grpc, port: 10901, targetPort: grpc}
    - {name: http, port: 10902, targetPort: http}
    - {name: remote-write, port: 19291, targetPort: remote-write}
---
# Headless, for the StatefulSet's pod names and for Query's dnssrv lookup.
apiVersion: v1
kind: Service
metadata:
  name: thanos-receive-headless
  namespace: thanos
  labels: {app.kubernetes.io/name: thanos-receive, app.kubernetes.io/part-of: thanos}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: thanos-receive}
  ports:
    - {name: grpc, port: 10901, targetPort: grpc}
---
# The only port this lane opens to the outside. externalTrafficPolicy Local:
# only the node running Receive answers, and the source address reaches the pod
# unchanged, so Receive's logs show which fin node wrote.
apiVersion: v1
kind: Service
metadata:
  name: thanos-receive-public
  namespace: thanos
  labels: {app.kubernetes.io/name: thanos-receive, app.kubernetes.io/part-of: thanos}
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector: {app.kubernetes.io/name: thanos-receive}
  ports:
    - {name: remote-write, port: 19291, targetPort: remote-write, nodePort: 30291}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-receive
  namespace: thanos
  labels: {app.kubernetes.io/name: thanos-receive, app.kubernetes.io/part-of: thanos}
spec:
  serviceName: thanos-receive-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: thanos-receive}
  template:
    metadata:
      labels: {app.kubernetes.io/name: thanos-receive, app.kubernetes.io/part-of: thanos}
    spec:
      nodeSelector:
        eu1.io/pool: cpu
      # Long enough for the final flush and upload of a 2 h window.
      terminationGracePeriodSeconds: 300
      containers:
        - name: thanos
          image: quay.io/thanos/thanos:v0.42.4@sha256:b567818fe608067eb0f1d7c2c4fe361e7ad83c8a256234c97685f1d0bf670cc8
          args:
            - receive
            - --log.level=info
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            - --remote-write.address=0.0.0.0:19291
            - --remote-write.server-tls-cert=/etc/thanos/tls/tls.crt
            - --remote-write.server-tls-key=/etc/thanos/tls/tls.key
            - --remote-write.server-tls-client-ca=/etc/thanos/tls/ca.crt
            - --receive.tenant-certificate-field=commonName
            - --receive.local-endpoint=$(POD_NAME).thanos-receive-headless.thanos.svc.cluster.local:10901
            - --label=receive_replica="$(POD_NAME)"
            - --tsdb.path=/var/thanos/receive
            # Local copy only. Blocks are in Garage from their first two hours,
            # and a tenant that stops writing (fin, after a window) is flushed,
            # uploaded and pruned here once this has passed.
            - --tsdb.retention=3d
            - --objstore.config-file=/etc/thanos/objstore/objstore.yml
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: grpc, containerPort: 10901}
            - {name: http, containerPort: 10902}
            - {name: remote-write, containerPort: 19291}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /var/thanos/receive}
            - {name: tls, mountPath: /etc/thanos/tls, readOnly: true}
            - {name: objstore, mountPath: /etc/thanos/objstore, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: thanos-receive-tls}
        # Delivered by the Garage bootstrap (cos). Not optional: without a
        # bucket Receive would keep everything on this one disk.
        - name: objstore
          secret: {secretName: thanos-objstore}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
