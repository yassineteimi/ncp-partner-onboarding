# NVIDIA GPU Operator on site par, sync wave 1.
#
# On par the operator owns the driver, as in Part 1: the L4 boots without one
# and the driver is a version string in gitops/values/base/gpu-operator-par.yaml.
#
# Values are layered: the shared base, then this site's driver ownership, then
# one optional overlay per lane. A lane that needs the operator configured
# differently (MIG, time slicing, DCGM settings) writes its own overlay file
# instead of editing the base. ignoreMissingValueFiles lets an overlay that
# doesn't exist yet stay listed here.
#
# Wave 1 because it needs the NFD labels from wave 0 to know which nodes are
# GPU nodes, and the Prometheus CRDs from kube-prometheus-stack for the DCGM
# exporter's ServiceMonitor.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://helm.ngc.nvidia.com/nvidia
      chart: gpu-operator
      targetRevision: v26.7.2
      helm:
        releaseName: gpu-operator
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/gitops/values/base/gpu-operator.yaml
          - $values/gitops/values/base/gpu-operator-par.yaml
          - $values/gitops/values/readiness/gpu-operator-par.yaml
          - $values/gitops/values/scheduling/gpu-operator-par.yaml
          - $values/gitops/values/platform/gpu-operator-par.yaml

    - repoURL: https://github.com/yassineteimi/ncp-partner-onboarding
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-operator

  # The operator's own controllers write status and defaults back into the
  # ClusterPolicy, which Argo CD would otherwise report as permanent drift.
  ignoreDifferences:
    - group: nvidia.com
      kind: ClusterPolicy
      jsonPointers:
        - /status

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
