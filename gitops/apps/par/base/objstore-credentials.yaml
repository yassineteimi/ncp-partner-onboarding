# Thanos's bucket credentials, sync wave -1.
#
# Before kube-prometheus-stack (wave 0), whose Prometheus can't start without
# Secret monitoring/thanos-objstore, and long before Garage (wave 5), which
# imports the same key. Details in gitops/manifests/base/objstore-credentials.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: objstore-credentials
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/yassineteimi/ncp-partner-onboarding
    targetRevision: main
    path: gitops/manifests/base/objstore-credentials

  destination:
    server: https://kubernetes.default.svc
    namespace: thanos

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
