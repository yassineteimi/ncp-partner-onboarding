# Recording rules for use case 6 (series per GPU), sync wave 10. The same
# rules run on fin, from gitops/apps/fin/platform/gpu-rules.yaml, so both sites
# count their GPUs the same way. Only a PrometheusRule: nothing here needs the
# CPU worker.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-rules
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/yassineteimi/ncp-partner-onboarding
    targetRevision: main
    path: gitops/manifests/platform/gpu-rules

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
