# Values for the NVIDIA GPU Operator, chart v26.7.2, shared by both sites.
#
# The GPU Operator Application of each site reads, in order:
#   1. this file
#   2. gitops/values/base/gpu-operator-<site>.yaml, which decides who owns the
#      driver on that site (ADR 0002): the operator on par, the provider image
#      on fin
#   3. gitops/values/{readiness,scheduling,platform}/gpu-operator-<site>.yaml,
#      if the lane has written one. Missing files are ignored, so a lane can
#      tune the operator through its own file instead of editing this one.
#
# Versions are written as literals rather than left to the chart defaults, so
# the version in Git is the version on the node and a chart bump can't move a
# component underneath the fleet as a side effect.

# NFD is a separate Application in sync wave 0. See gitops/apps/<site>/base/node-feature-discovery.yaml.
nfd:
  enabled: false

toolkit:
  enabled: true
  repository: nvcr.io/nvidia/k8s
  image: container-toolkit
  # Chart v26.7.2 default. Part 1 ran v1.20.0 under chart v26.7.0.
  version: v1.20.1

# The device plugin is what turns a GPU into nvidia.com/gpu on the node's
# allocatable list. Time slicing or MIG configs come from the lanes' overlays.
devicePlugin:
  enabled: true

# DCGM and its exporter ship inside this chart rather than as a separate
# deployment.
#
# Standalone DCGM is a decision, not the chart's default. The default is
# dcgm.enabled: false, with the exporter running the DCGM host engine embedded.
# The standalone host engine is kept because dcgmi diag needs a running host
# engine to talk to, as Part 1's return to service did, and NVSentinel's DCGM
# health monitor is set up against it in use case 3. Its price, measured in Part 1: the
# exporter restarts a couple of times at every node start, until the host engine
# answers.
dcgm:
  enabled: true

dcgmExporter:
  enabled: true

  # The counter set, owned here rather than taken from the image.
  #
  # The operator mounts this ConfigMap into the exporter and points
  # DCGM_EXPORTER_COLLECTORS at it (controllers/object_controls.go in the
  # operator). It replaces the exporter's default set entirely, so everything
  # wanted from the default set is listed again below.
  #
  # Every field name below exists in etc/default-counters.csv of dcgm-exporter
  # 4.8.4, the version chart v26.7.2 deploys (checked field by field against
  # that tag on 2026-10-19). That is deliberate: an unknown field name stops the
  # exporter from starting, and it would stop on a node billed by the hour.
  #
  # Added to the defaults: XID and clock event counters, ECC, power and thermal
  # violations, SM activity and DCGM health status.
  # Removed from the defaults: NVLink bandwidth and vGPU licence status. An L4
  # has neither. A lane that wants NVLink counters on the H200 replaces this
  # whole data block in its fin overlay, and gives the ConfigMap a new name, so
  # the change can't hide behind an unchanged name.
  config:
    name: eu1-dcgm-metrics
    create: true
    data: |-
      # Utilisation
      DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization (in %).
      DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory utilization (in %).
      DCGM_FI_DEV_ENC_UTIL, gauge, Encoder utilization (in %).
      DCGM_FI_DEV_DEC_UTIL, gauge, Decoder utilization (in %).

      # Profiling. GPU_UTIL only says a kernel was running; these say how much
      # of the chip it was using, which is the difference between busy and
      # productive.
      DCGM_FI_PROF_GR_ENGINE_ACTIVE, gauge, Ratio of time the graphics engine is active.
      DCGM_FI_PROF_SM_ACTIVE, gauge, The ratio of cycles an SM has at least 1 warp assigned.
      DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Ratio of cycles the tensor (HMMA) pipe is active.
      DCGM_FI_PROF_DRAM_ACTIVE, gauge, Ratio of cycles the device memory interface is active sending or receiving data.
      # A rate, so a gauge. Part 1 declared these two as counters, from a
      # commented-out line in the 4.8.3 file; 4.8.4 documents them as below.
      DCGM_FI_PROF_PCIE_TX_BYTES, gauge, The rate of data transmitted over the PCIe bus - including both protocol headers and data payloads - in bytes per second.
      DCGM_FI_PROF_PCIE_RX_BYTES, gauge, The rate of data received over the PCIe bus - including both protocol headers and data payloads - in bytes per second.

      # Memory
      DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free (in MiB).
      DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used (in MiB).
      DCGM_FI_DEV_FB_RESERVED, gauge, Framebuffer memory reserved (in MiB).

      # Thermal and power
      DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature (in C).
      DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature (in C).
      DCGM_FI_DEV_POWER_USAGE, gauge, Power draw (in W).
      DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy consumption since boot (in mJ).

      # Clocks, and why they drop. The violation counters are in nanoseconds.
      DCGM_FI_DEV_SM_CLOCK, gauge, SM clock frequency (in MHz).
      DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency (in MHz).
      DCGM_FI_DEV_POWER_VIOLATION, counter, Throttling duration due to power constraints (in ns).
      DCGM_FI_DEV_THERMAL_VIOLATION, counter, Throttling duration due to thermal constraints (in ns).
      DCGM_EXP_CLOCK_EVENTS_TOTAL, counter, Total clock events observed since exporter start (edge-counted).

      # Memory health
      DCGM_FI_DEV_ECC_SBE_VOL_TOTAL, counter, Total number of single-bit volatile ECC errors.
      DCGM_FI_DEV_ECC_DBE_VOL_TOTAL, counter, Total number of double-bit volatile ECC errors.
      DCGM_FI_DEV_ECC_SBE_AGG_TOTAL, counter, Total number of single-bit persistent ECC errors.
      DCGM_FI_DEV_ECC_DBE_AGG_TOTAL, counter, Total number of double-bit persistent ECC errors.
      DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, Number of remapped rows for uncorrectable errors
      DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS, counter, Number of remapped rows for correctable errors
      DCGM_FI_DEV_ROW_REMAP_FAILURE, gauge, Whether remapping of rows has failed

      # Bus
      DCGM_FI_DEV_PCIE_REPLAY_COUNTER, counter, Total number of PCIe retries.

      # XID and health. XID_ERRORS is the last XID seen and never resets, so it
      # is kept for the dashboard only. Alerts use XID_ERRORS_TOTAL, a real
      # counter with one series per xid label. It resets when the exporter
      # restarts, which increase() handles, but an XID raised while the
      # exporter is down is not counted at all.
      DCGM_FI_DEV_XID_ERRORS, gauge, Value of the last XID error encountered.
      DCGM_EXP_XID_ERRORS_TOTAL, counter, Total XID errors observed since exporter start.
      DCGM_EXP_GPU_HEALTH_STATUS, gauge, Current DCGM-reported GPU health status.

      DCGM_FI_DRIVER_VERSION, label, Driver Version

# Off by default. The L4 has no MIG; on fin, the scheduling lane turns it on in
# its own overlay with a config named after what it does.
migManager:
  enabled: false

# Neither of these applies to a plain CUDA node.
gds:
  enabled: false

vfioManager:
  enabled: false
