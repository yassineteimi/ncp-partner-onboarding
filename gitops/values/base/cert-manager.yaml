# Values for cert-manager, chart v1.21.2, site par.
#
# In base because two lanes need it: NVSentinel (use case 3, wave 11) and
# Slurm through Slinky (use case 5), whose chart would otherwise regenerate its
# webhook CA on every render under ArgoCD (Part 1's lookup lesson). NVSentinel
# asks for cert-manager 1.21 or newer.
#
# Pinned to the control plane, not the CPU worker: as a base Application in
# wave 3, a cert-manager that went Degraded while the worker is powered off
# would hold back the waves after it. Its three components are small, and its
# webhooks only intercept cert-manager.io resources.

crds:
  enabled: true
  # Uninstalling the chart must not delete every Certificate in the cluster.
  keep: true

# Images pinned by the digest of each v1.21.2 image index on quay.io, read
# from the registry on 20 October.
image:
  digest: sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8

nodeSelector:
  node-role.kubernetes.io/control-plane: ""

resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {memory: 256Mi}

webhook:
  image:
    digest: sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

cainjector:
  image:
    digest: sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 256Mi}

startupapicheck:
  image:
    digest: sha256:46e75b6866359ffb5d82624f41e3ed1c70b2994982702ced547ce5edb418a8f5
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
