# Platform lane overlay for kube-prometheus-stack 91.4.1 on par, read after
# gitops/values/base/kube-prometheus-stack{,-par}.yaml. Use case 6.
#
# par is the permanent site, so its Prometheus keeps working as it did in
# Part 1 (local alerting, 15 days on its own disk) and gains a Thanos sidecar:
#   - Thanos Query reads par's recent data through the sidecar's gRPC API;
#   - the sidecar uploads every 2 hour block to Garage, for long-term storage
#     and so the compactor has something long enough to downsample.
# No remote write from par: it would make par's Prometheus depend on the CPU
# worker, which is powered off most of the time (ADR 0009).

prometheus:
  prometheusSpec:
    thanos:
      image: quay.io/thanos/thanos:v0.42.4@sha256:b567818fe608067eb0f1d7c2c4fe361e7ad83c8a256234c97685f1d0bf670cc8
      version: v0.42.4
      # Secret monitoring/thanos-objstore, written by the base Application
      # objstore-credentials at wave -1, before this chart's wave 0
      # (gitops/manifests/base/objstore-credentials/).
      #
      # The chart only accepts it as existingSecret and renders name and key,
      # nothing else (templates/prometheus/prometheus.yaml at 91.4.1), so it
      # can't be marked optional: the Prometheus pod needs this Secret to
      # start, which is why it has to exist before wave 0.
      objectStorageConfig:
        existingSecret:
          name: thanos-objstore
          key: objstore.yml
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}

  # The sidecar's gRPC port, for Thanos Query's dnssrv lookup:
  # kube-prometheus-stack-thanos-discovery.monitoring.svc.
  thanosService:
    enabled: true
  # And its metrics, thanos_shipper_uploads_total among them.
  thanosServiceMonitor:
    enabled: true

########################################
# Kubelet targets
#
# ws-scheduling's KWOK nodes, eu1-par-sim-gpu-01 and -02 (SIMULATED GPUs,
# docs/simulated.md), are Node objects with no kubelet behind them. The
# operator's kubelet Endpoints list every Node, so each KWOK node added
# three targets that can never answer (/metrics, /metrics/cadvisor,
# /metrics/probes), raising TargetDown and KubeletInstanceUnreachable.
# They're dropped by node name, which the Endpoints role sets.
#
# Setting these lists replaces the chart's defaults, which hold only the
# metrics_path rule (values.yaml at 91.4.1), so that rule comes first.
########################################

kubelet:
  serviceMonitor:
    relabelings: &kubelet-relabelings
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: drop
        sourceLabels: [__meta_kubernetes_endpoint_node_name]
        regex: eu1-par-sim-gpu-.*
    cAdvisorRelabelings: *kubelet-relabelings
    probesRelabelings: *kubelet-relabelings

########################################
# Grafana
#
# Thanos Query as a second data source, beside the chart's local Prometheus
# one, which stays the default so Part 1's dashboards don't change. The
# cross-site dashboard asks for this one by uid.
########################################

grafana:
  additionalDataSources:
    - name: Thanos (EU1)
      uid: thanos-eu1
      type: prometheus
      access: proxy
      url: http://thanos-query.thanos.svc:9090
      editable: false
      jsonData:
        prometheusType: Thanos
        timeInterval: 30s
