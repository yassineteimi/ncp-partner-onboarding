# Values for the argo-cd chart, applied once by scripts/bootstrap-argocd.sh.
#
# This is the only Helm release in the cluster installed by a human running a
# command. Everything after it, including its own values from Session B onward,
# arrives through ArgoCD from this repository. Something has to install the
# thing that installs everything else, and this is it.
#
# The cluster is one 4 vCPU control plane node, so the high availability pieces
# are off. On a real fleet none of these would be.

global:
  # Argo CD is reached with kubectl port-forward, not through an ingress, so
  # there is no hostname and no certificate to manage.
  domain: argocd.local

configs:
  params:
    # TLS is terminated at the port-forward, which is a loopback socket on the
    # operator's laptop. Running the server insecure avoids a self signed
    # certificate that nothing would meaningfully verify.
    server.insecure: true

  cm:
    # ClusterRoles built by aggregation have their rules filled in by the API
    # server, not by the manifest, so without this they read as permanently out
    # of sync. kube-prometheus-stack ships several.
    resource.compareoptions: |
      ignoreAggregatedRoles: true

    # Health for Application resources, restored.
    #
    # ArgoCD stopped assessing the health of Application resources in 1.8. In an
    # app of apps, that means sync waves between child Applications only order
    # their creation: wave 1 is created the moment wave 0 is created, not once
    # wave 0 is healthy. This repository's wave table assumed the second
    # behaviour from Session A onward and was getting the first. It happened not
    # to matter, because the GPU Operator waits for NFD's labels on its own. It
    # matters from Session B, where the GPU Operator's ServiceMonitor needs the
    # Prometheus CRDs from an earlier wave to actually exist.
    #
    # This is the check ArgoCD's own documentation gives for restoring it:
    # docs/operator-manual/health.md, "Argocd App".
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

    # Health for KAI Scheduler's Config and SchedulingShard (use case 4),
    # verbatim from kai-scheduler/KAI-Scheduler v0.18.6 (commit 279f61c6),
    # docs/gitops/README.md, "ArgoCD health check"; the same file says
    # SchedulingShard reports the same conditions, so it gets the same block.
    # Healthy only when Deployed, Available and DependenciesFulfilled are True
    # for the current generation; Degraded when DependenciesFulfilled is False.
    resource.customizations.health.kai.scheduler_Config: |
      local hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for the KAI operator to reconcile the resource"

      if obj.status == nil or obj.status.conditions == nil then
        return hs
      end

      local generation = obj.metadata.generation
      local byType = {}
      for _, condition in ipairs(obj.status.conditions) do
        byType[condition.type] = condition
      end

      -- DependenciesFulfilled=False (reason dependencies_missing) is the only
      -- condition that means a real, user-actionable dependency is absent, so map
      -- it to Degraded. Deployed=False and Available=False are normal transient
      -- states while pods roll out, so they stay Progressing.
      local deps = byType["DependenciesFulfilled"]
      if deps ~= nil and deps.observedGeneration == generation and deps.status == "False" then
        hs.status = "Degraded"
        hs.message = "DependenciesFulfilled: " .. (deps.message or deps.reason or "dependencies are missing")
        return hs
      end

      local required = {"Deployed", "Available", "DependenciesFulfilled"}
      for _, name in ipairs(required) do
        local condition = byType[name]
        if condition == nil or condition.observedGeneration ~= generation then
          hs.status = "Progressing"
          hs.message = name .. " has not been observed for the current generation"
          return hs
        end
        if condition.status ~= "True" then
          hs.status = "Progressing"
          hs.message = name .. " is " .. tostring(condition.status)
          return hs
        end
      end

      hs.status = "Healthy"
      hs.message = "KAI resource reconciled for the current generation"
      return hs

    resource.customizations.health.kai.scheduler_SchedulingShard: |
      local hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for the KAI operator to reconcile the resource"

      if obj.status == nil or obj.status.conditions == nil then
        return hs
      end

      local generation = obj.metadata.generation
      local byType = {}
      for _, condition in ipairs(obj.status.conditions) do
        byType[condition.type] = condition
      end

      -- DependenciesFulfilled=False (reason dependencies_missing) is the only
      -- condition that means a real, user-actionable dependency is absent, so map
      -- it to Degraded. Deployed=False and Available=False are normal transient
      -- states while pods roll out, so they stay Progressing.
      local deps = byType["DependenciesFulfilled"]
      if deps ~= nil and deps.observedGeneration == generation and deps.status == "False" then
        hs.status = "Degraded"
        hs.message = "DependenciesFulfilled: " .. (deps.message or deps.reason or "dependencies are missing")
        return hs
      end

      local required = {"Deployed", "Available", "DependenciesFulfilled"}
      for _, name in ipairs(required) do
        local condition = byType[name]
        if condition == nil or condition.observedGeneration ~= generation then
          hs.status = "Progressing"
          hs.message = name .. " has not been observed for the current generation"
          return hs
        end
        if condition.status ~= "True" then
          hs.status = "Progressing"
          hs.message = name .. " is " .. tostring(condition.status)
          return hs
        end
      end

      hs.status = "Healthy"
      hs.message = "KAI resource reconciled for the current generation"
      return hs

controller:
  replicas: 1

server:
  replicas: 1

repoServer:
  replicas: 1

applicationSet:
  enabled: false

notifications:
  enabled: false

dex:
  enabled: false

redis-ha:
  enabled: false
