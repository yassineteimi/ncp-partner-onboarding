# The app of apps for site par. The only Application applied by hand, by
# make par-argocd. It reads gitops/apps/par/ recursively, so adding a
# component to the site is a file in a commit:
#
#   gitops/apps/par/base/         the platform, owned by cos
#   gitops/apps/par/readiness/    use cases 1 to 3
#   gitops/apps/par/scheduling/   use cases 4 and 5
#   gitops/apps/par/platform/     use cases 6 and 7
#
# Only Application manifests belong under gitops/apps/. Plain manifests live in
# gitops/manifests/<lane>/ and are pointed at by an Application: a
# kustomization.yaml found by a recursive directory source is applied as if it
# were a Kubernetes object, and the sync fails.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/yassineteimi/ncp-partner-onboarding
    targetRevision: main
    path: gitops/apps/par
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  # ArgoCD's controller adds pre-delete and post-delete finalizers to an
  # Application whose chart has PreDelete or PostDelete hooks (gpu-operator and
  # NFD here). Git doesn't list them, so without this the root stays OutOfSync.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - '.metadata.finalizers[] | select(startswith("pre-delete-finalizer.argocd.argoproj.io") or startswith("post-delete-finalizer.argocd.argoproj.io"))'

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
