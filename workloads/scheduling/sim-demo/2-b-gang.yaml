# par demo, step 2 of 3. SIMULATED GPUs.
#
# team-b, at 0 of its quota of 4, submits a gang of 4. The cluster is full of
# team-a's pods, 4 of them borrowed. KAI's reclaim evicts the borrowed ones,
# never team-a's in-quota 4, then binds all 4 of team-b's pods together.
# team-a's Job recreates the evicted pods, which wait Pending.
apiVersion: batch/v1
kind: Job
metadata:
  name: b-gang
  namespace: team-b
  labels:
    kai.scheduler/queue: team-b
    eu1.io/simulated: "true"
  annotations:
    kai.scheduler/batch-min-member: "4"
spec:
  completions: 4
  parallelism: 4
  template:
    metadata:
      labels:
        kai.scheduler/queue: team-b
        eu1.io/simulated: "true"
    spec:
      schedulerName: kai-scheduler
      priorityClassName: train
      restartPolicy: Never
      nodeSelector:
        eu1.io/pool: sim-gpu
      tolerations:
        - key: kwok.x-k8s.io/node
          operator: Exists
          effect: NoSchedule
        - key: eu1.io/simulated
          operator: Exists
          effect: NoExecute
      containers:
        - name: train
          image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
            limits:
              nvidia.com/gpu: 1
