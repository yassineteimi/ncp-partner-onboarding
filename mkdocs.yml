site_name: "Nordhaven: a GPU cloud partner from handover to first workloads"
site_author: Yassine TEIMI
site_url: https://yassineteimi.github.io/ncp-partner-onboarding/
site_description: >-
  Part 2 of my GPU fleet work. Nordhaven, a fictional European GPU cloud partner,
  goes from hardware handover to its first production workloads on NVIDIA's open
  stack, across a Paris site and a Finland site on two providers, driven by one
  Git repository.

repo_name: yassineteimi/ncp-partner-onboarding
repo_url: https://github.com/yassineteimi/ncp-partner-onboarding

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  palette:
    - scheme: slate
      toggle: { icon: material/toggle-switch, name: Switch to light mode }
      primary: teal
      accent: lime
    - scheme: default
      toggle: { icon: material/toggle-switch-off-outline, name: Switch to dark mode }
      primary: teal
      accent: purple

extra_css:
  - stylesheets/terminal.css
  - stylesheets/diagram-zoom.css

extra_javascript:
  - javascripts/diagram-zoom.js
  - javascripts/tab-anchors.js

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/yassineteimi
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/yassine-teimi

markdown_extensions:
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.mark
  - pymdownx.tabbed: { alternate_style: true }
  - attr_list
  - md_in_html
  - footnotes
  - tables

plugins:
  - search

nav:
  - "AI Factory": ownership-map.md
  - "PoC Overview": index.md
  - Architecture: architecture.md
  - "Day 1": 10-day1.md
  - "Day 2":
      - "NVSentinel": 10-day2-nvsentinel.md
      - "Tenancy: KAI and MIG": 20-tenancy.md
      - "HPC: Slurm with Slinky": 21-hpc-slinky.md
      - "Observability with Thanos": 30-metrics-across-sites.md
      - "VM tenants": 30-vm-tenants.md
  - "What is simulated": simulated.md
  - Decisions:
      - "All decisions": adr/README.md
      - "0001: Two sites, two providers": adr/0001-two-sites-two-providers.md
      - "0002: Driver ownership": adr/0002-driver-ownership.md
      - "0003: Known-good stack": adr/0003-known-good-stack.md
      - "0004: Readiness gate": adr/0004-readiness-gate.md
      - "0005: Fault remediation": adr/0005-fault-remediation.md
      - "0006: Batch scheduling": adr/0006-batch-scheduling.md
      - "0007: HPC tenants": adr/0007-hpc-tenants-slurm.md
      - "0008: GPU sharing": adr/0008-gpu-sharing.md
      - "0009: Metrics across sites": adr/0009-metrics-across-sites.md
      - "0010: VM tenants": adr/0010-vm-tenants.md
  - Findings: findings.md

copyright: |
  &copy; 2026 <a href="https://github.com/yassineteimi" target="_blank" rel="noopener">Yassine TEIMI</a>
