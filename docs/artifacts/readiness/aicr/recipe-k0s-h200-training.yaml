                    apiVersion: apiextensions.k8s.io/v1
                    kind: CustomResourceDefinition
                    metadata:
                      name: servicemonitors.monitoring.coreos.com
                    status:
                      (conditions[?type == 'Established']):
                        - status: "True"
              - assert:
                  resource:
                    apiVersion: apiextensions.k8s.io/v1
                    kind: CustomResourceDefinition
                    metadata:
                      name: thanosrulers.monitoring.coreos.com
                    status:
                      (conditions[?type == 'Established']):
                        - status: "True"
