apiVersion: nvcre.nvidia.com/v1alpha1
kind: Workflow
metadata:
  labels:
    app.kubernetes.io/managed-by: nvcre
    nvcre.nvidia.com/category-domain: communication
    nvcre.nvidia.com/category-variant: nccl-all-reduce
    nvcre.nvidia.com/certification: eu1-par-l4
  name: eu1-par-l4-communication-7afe9
spec:
  dependencies:
  - apiVersion: trainer.kubeflow.org/v1alpha1
    kind: TrainingRuntime
    metadata:
      labels:
        app: nccl-all-reduce
        trainer.kubeflow.org/framework: mpi
      name: nccl-all-reduce-runtime
    spec:
      mlPolicy:
        mpi:
          mpiImplementation: OpenMPI
          numProcPerNode: 1
          sshAuthMountPath: /tmp/mpi-ssh-raw
        numNodes: 1
      template:
        spec:
          network:
            publishNotReadyAddresses: true
          replicatedJobs:
          - name: node
            template:
              spec:
                template:
                  spec:
                    containers:
                    - args:
                      - |-
                        set -x &&
                        test -x /usr/sbin/sshd || (apt-get update && apt-get install -y --no-install-recommends openssh-server) &&
                        mkdir -p /var/run/sshd  &&
                        chmod 0755 /var/run/sshd  &&
                        mkdir -p /root/.ssh &&
                        chmod 700 /root/.ssh &&
                        cp /tmp/mpi-ssh-raw/* /root/.ssh/ &&
                        chmod 600 /root/.ssh/id_rsa &&
                        chmod 644 /root/.ssh/id_rsa.pub /root/.ssh/authorized_keys &&
                        /usr/sbin/sshd -De
                      command:
                      - sh
                      - -c
                      image: nvcr.io/nvidia/pytorch:26.01-py3
                      name: node
                      readinessProbe:
                        exec:
                          command:
                          - sh
                          - -c
                          - |-
                            command -v ssh >/dev/null 2>&1 || exec grep -q ':0016 [0-9A-F]*:[0-9A-F]* 0A ' /proc/net/tcp /proc/net/tcp6
                            set -- ssh -n -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 127.0.0.1 true
                            command -v timeout >/dev/null 2>&1 && set -- timeout 8 "$@"
                            exec "$@"
                        initialDelaySeconds: 5
                        periodSeconds: 30
                        timeoutSeconds: 10
                      resources:
                        limits:
                          nvidia.com/gpu: "1"
                        requests:
                          nvidia.com/gpu: "1"
                      securityContext:
                        capabilities:
                          add:
                          - IPC_LOCK
                          - SYS_CHROOT
                      volumeMounts:
                      - mountPath: /tmp/mpi-ssh-raw
                        name: mpi-ssh-auth
                        readOnly: true
                    restartPolicy: OnFailure
          - dependsOn:
            - name: node
              status: Ready
            name: launcher
            template:
              metadata:
                labels:
                  trainer.kubeflow.org/trainjob-ancestor-step: trainer
              spec:
                template:
                  spec:
                    containers:
                    - image: nvcr.io/nvidia/pytorch:26.01-py3
                      name: node
                      resources:
                        limits:
                          cpu: "2"
                          memory: 1Gi
                      volumeMounts:
                      - mountPath: /tmp/mpi-ssh-raw
                        name: mpi-ssh-auth
                        readOnly: true
                      - mountPath: /root/.ssh
                        name: ssh-keys
                    initContainers:
                    - args:
                      - |-
                        set -x &&
                        cp /tmp/mpi-ssh-raw/* /root/.ssh/ &&
                        chmod 600 /root/.ssh/id_rsa &&
                        chmod 644 /root/.ssh/id_rsa.pub /root/.ssh/authorized_keys
                      command:
                      - sh
                      - -c
                      image: nvcr.io/nvidia/pytorch:26.01-py3
                      name: fix-ssh-permissions
                      volumeMounts:
                      - mountPath: /tmp/mpi-ssh-raw
                        name: mpi-ssh-auth
                        readOnly: true
                      - mountPath: /root/.ssh
                        name: ssh-keys
                    restartPolicy: OnFailure
                    volumes:
                    - emptyDir: {}
                      name: ssh-keys
          successPolicy:
            operator: All
            targetReplicatedJobs:
            - launcher
  jobTemplate:
    spec:
      bandwidthMeasurement:
        logProfileRef: nccl-bandwidth
        sampleInterval: 30s
        testType: all_reduce
      nodeHealthMonitor:
        cel:
          expression: node.spec.unschedulable == true
      workload:
        trainJob:
          runtimePatches:
          - manager: nvcre.nvidia.com/catalog
            trainingRuntimeSpec:
              template:
                spec:
                  replicatedJobs:
                  - name: node
                    template:
                      spec:
                        template:
                          spec:
                            containers:
                            - name: node
                              volumeMounts:
                              - mountPath: /dev/shm
                                name: dshm
                            volumes:
                            - emptyDir:
                                medium: Memory
                              name: dshm
                  - name: launcher
          runtimeRef:
            kind: TrainingRuntime
            name: nccl-all-reduce-runtime
          trainer:
            args:
            - -N
            - "1"
            - --allow-run-as-root
            - --mca
            - plm_rsh_args
            - -o StrictHostKeyChecking=no
            - -x
            - NCCL_DEBUG=INFO
            - -x
            - NCCL_MNNVL_ENABLE=0
            - -x
            - NCCL_DEBUG_SUBSYS=INIT,GRAPH
            - /usr/local/bin/all_reduce_perf_mpi
            - -b
            - "8"
            - -e
            - 16G
            - -f
            - "2"
            - -n
            - "100"
            - -N
            - "10"
            command:
            - timeout
            - "3600"
            - /usr/local/mpi/bin/mpirun
            image: nvcr.io/nvidia/pytorch:26.01-py3
            numNodes: 1
            numProcPerNode: 1
  orchestration:
    execution:
      timeoutPerJob: 1h0m0s
    iterations: 1
    target:
      nodeSelector:
        eu1.io/pool: gpu
        eu1.io/site: par
        nvidia.com/gpu.product: NVIDIA-L4
      taintSelectors:
      - effect: NoSchedule
        key: eu1.io/staging
