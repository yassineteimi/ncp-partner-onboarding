<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        background: #0b0e0c;
        overflow: hidden;
      }
      :root {
        --bg: #0b0e0c;
        --fg: #f2f5ee;
        --muted: #a3ab9f;
        --faint: #7d8679;
        --green: #76b900;
        --blue: #6fa8dc;
        --orange: #f6b26b;
        --purple: #b4a7d6;
        --red: #ff6f61;
        --glass: rgba(14, 18, 15, 0.66);
        --edge: rgba(255, 255, 255, 0.1);
        --sans: Inter, "Helvetica Neue", sans-serif;
        --mono: "JetBrains Mono", monospace;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--sans);
        color: var(--fg);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }

      /* Footage plates: one per scene, each in an untimed wrapper the root timeline zooms. */
      .plate {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .plate .cam {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      .plate video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #scrim-left {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(11, 14, 12, 0.78) 0%, rgba(11, 14, 12, 0.4) 40%, rgba(11, 14, 12, 0.4) 62%, rgba(11, 14, 12, 0.88) 100%);
      }
            #scrim-full {
        position: absolute;
        inset: 0;
        background: rgba(11, 14, 12, 0.78);
        opacity: 0;
      }

      /* Shared scene vocabulary, used by every sub-composition. */
      .stage {
        position: absolute;
        inset: 0;
        will-change: transform, opacity, filter;
      }
      .kicker {
        position: absolute;
        left: 64px;
        top: 64px;
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: var(--mono);
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg);
      }
      .kicker .dot {
        display: block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: currentColor;
      }
      .tag {
        display: inline-block;
        font-family: var(--mono);
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 8px 16px;
        border-radius: 10px;
        border: 2px solid currentColor;
      }
      .tag.ran {
        color: var(--green);
      }
      .tag.designed {
        color: var(--orange);
        border-style: dashed;
      }
      .tag.injected {
        color: var(--red);
      }
      .statement {
        position: absolute;
        left: 64px;
        bottom: 250px;
        width: 952px;
        font-weight: 900;
        font-size: 80px;
        line-height: 1;
        letter-spacing: -0.035em;
        color: var(--fg);
        text-wrap: balance;
      }
      .statement .w {
        display: inline-block;
      }
      .second {
        font-weight: 700;
        font-size: 42px;
        line-height: 1.12;
        letter-spacing: -0.02em;
        color: var(--muted);
        text-wrap: balance;
      }
      .source {
        font-family: var(--mono);
        font-size: 28px;
        letter-spacing: 0.01em;
        color: var(--faint);
      }
      .glass {
        background: var(--glass);
        backdrop-filter: blur(28px) saturate(140%);
        border: 2px solid var(--edge);
        border-top-color: rgba(255, 255, 255, 0.2);
        border-radius: 28px;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
    </style>
    <script>
      // Motion helpers shared by every scene, carried over from Part 1's video:
      // critically damped springs expressed as GSAP eases so they stay seekable.
      (function () {
        function critical(w) {
          var end = 1 - (1 + w) * Math.exp(-w);
          return function (t) {
            if (t >= 1) return 1;
            return (1 - (1 + w * t) * Math.exp(-w * t)) / end;
          };
        }
        var smooth = critical(8);
        window.HF = {
          smooth: smooth,
          enter: function (tl, target, at) {
            tl.fromTo(
              target,
              { opacity: 0, scale: 1.03, filter: "blur(10px)" },
              { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: smooth },
              at || 0,
            );
          },
          exit: function (tl, target, at) {
            tl.to(target, { opacity: 0, scale: 0.97, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, at);
          },
          rise: function (tl, target, at, o) {
            o = o || {};
            tl.fromTo(
              target,
              { opacity: 0, y: o.y || 28, filter: "blur(6px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: o.duration || 0.55, ease: smooth, stagger: o.stagger || 0 },
              at,
            );
          },
          count: function (tl, el, from, to, at, dur, o) {
            o = o || {};
            var p = { v: from };
            var d = o.decimals || 0;
            var fmt = function (v) {
              var s = v.toFixed(d);
              if (o.group) s = Number(s).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
              return s + (o.suffix || "");
            };
            el.textContent = fmt(from);
            tl.fromTo(
              p,
              { v: from },
              { v: to, duration: dur, ease: o.ease || smooth, onUpdate: function () { el.textContent = fmt(p.v); } },
              at,
            );
          },
        };
      })();
    </script>
  </head>

    <script>
      const tl = gsap.timeline({ paused: true });
      const IN = { from: 1.0, to: 1.07 };
      const OUT = { from: 1.1, to: 1.0 };
      // timing:start (scripts/retime.py)
      const AT = {"s01": 0.0, "s02": 5.4, "s03": 14.4, "s04": 27.9, "s06": 40.2, "s07": 50.8, "s08": 63.9, "s09": 73.8, "s11": 81.4};
      const SLOT = {"s01": 5.4, "s02": 9.0, "s03": 13.5, "s04": 12.3, "s06": 10.6, "s07": 13.1, "s08": 9.9, "s09": 7.6, "s11": 11.0};
      // timing:end
      const MOVE = { s01: OUT, s02: OUT, s03: IN, s04: IN, s06: IN, s07: IN, s08: OUT, s09: IN, s11: IN };
      Object.keys(AT).forEach((sid) => {
        const m = MOVE[sid];
        tl.fromTo("#cam" + sid.slice(1), { scale: m.from }, { scale: m.to, duration: SLOT[sid], ease: "sine.inOut" }, AT[sid]);
      });
      // The end card sits on a darker plate.
      tl.fromTo("#scrim-full", { opacity: 0 }, { opacity: 0.55, duration: 0.8, ease: "power1.inOut" }, AT.s11);
      tl.to("#scrim-full", { opacity: 0.85, duration: 1.0, ease: "power1.inOut" }, AT.s11 + 7.0);
      window.__timelines["main"] = tl;
